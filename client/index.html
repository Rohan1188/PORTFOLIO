    <!-- Sets the theme before first paint (replaces the Next.js ThemeScript component) -->
    <script>
      (function () { try { var t = localStorage.getItem("theme"); document.documentElement.setAttribute("data-theme", t === "light" || t === "dark" ? t : "light"); } catch (e) {} })();
    </script>
  </head>
